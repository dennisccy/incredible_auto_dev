deny:
# NOTE: no `Bash(rm -rf /*)` entry here — `*` matches ANY suffix, so that pattern
# swallows every absolute path including /tmp (deny always beats allow, so it
# nullified the `Bash(rm -rf /tmp/*)` allow above). Root/home wipes are covered
# by the exact `Bash(rm -rf /)` below, the enumerated system dirs, and Claude
# Code's built-in rm circuit breaker (fires even in bypassPermissions mode).
- Bash(rm -rf /)
- Bash(rm -rf ~)
- Bash(rm -rf ~/)
- Bash(rm -rf ~/*)
- Bash(rm -rf /home*)
- Bash(rm -rf /root*)
- Bash(rm -rf /etc*)
- Bash(rm -rf /usr*)
- Bash(rm -rf /var*)
- Bash(rm -rf /boot*)
- Bash(rm -rf /lib*)
- Bash(rm -rf /opt*)
- Bash(rm -rf /srv*)
- Bash(rm -rf /sys*)
- Bash(rm -rf /proc*)
# System dirs missing from the enumeration above.
- Bash(rm -rf /mnt*)
- Bash(rm -rf /media*)
- Bash(rm -rf /dev*)
- Bash(rm -rf /bin*)
- Bash(rm -rf /sbin*)
# Embedded-pattern hardening: control-flow/wrapper allows (do/then/env/timeout/
# xargs) put destructive commands mid-segment where prefix denies never match
# (`do rm -rf /etc`). Leading-glob entries match ANYWHERE in a segment; deny
# beats allow. NEVER add a bare `* rm -rf /*` (would swallow /tmp cleanup —
# see header note above). These may false-positive on commands merely quoting
# the strings; acceptable for this catastrophic class.
- Bash(* rm -rf /etc*)
- Bash(* rm -rf /usr*)
- Bash(* rm -rf /home*)
- Bash(* rm -rf /root*)
- Bash(* rm -rf /var*)
- Bash(* rm -rf /boot*)
- Bash(* rm -rf /lib*)
- Bash(* rm -rf /opt*)
- Bash(* rm -rf /srv*)
- Bash(* rm -rf /mnt*)
- Bash(* rm -rf /media*)
- Bash(* rm -rf /dev*)
- Bash(* rm -rf ~*)
- Bash(* dd if=/dev/*)
- Bash(* mkfs*)
- Bash(* sudo rm*)
- Bash(* sudo dd*)
- Bash(* sudo mkfs*)
- Bash(* sudo mount*)
- Bash(* sudo chown*)
- Bash(* sudo chmod*)
- Bash(*~/.ssh/id_*)
- Bash(*~/.aws/credentials*)
- Bash(*/etc/shadow*)
